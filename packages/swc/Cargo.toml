[package]
name = "relyzer_swc"
version = "1.0.0-alpha.5"
edition = "2021"
description = "SWC/Wasm analyzer core for relyzer"
license = "MIT"

[lib]
path = "rust-src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
node-api = []
swc-plugin = []

[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.115"
swc_common = "0.33"
swc_ecma_ast = { version = "0.112", features = ["serde-impl"] }
swc_ecma_parser = "0.143"
swc_ecma_visit = "0.98"
wasm-bindgen = "0.2"
js-sys = "0.3"
swc_plugin_macro = "0.9"
swc_plugin_proxy = "0.49"

[profile.release]
lto = true
opt-level = "s"
