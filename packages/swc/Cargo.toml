[package]
name = "relyzer_swc"
version = "1.0.0-alpha.5"
edition = "2021"
description = "SWC/Wasm analyzer core for relyzer"
license = "MIT"

[lib]
path = "rust-src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.115"
swc_common = "0.33"
swc_ecma_ast = "0.112"
swc_ecma_parser = "0.143"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
